[workspace]
members = [
  "crates/nuvim-codegen",
  "crates/nuvim-protocol",
  "crates/nu-plugin-nuvim",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/roshbhatia/nu_plugin_nvim"
homepage = "https://github.com/roshbhatia/nu_plugin_nvim"
description = "Control Neovim as native Nushell data over MessagePack-RPC"
keywords = ["neovim", "nushell", "msgpack", "rpc"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
nu-plugin = "0.115.1"
nu-protocol = "0.115.1"
rmpv = "1.3.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
