[workspace]
members = [
  "crates/nuvim-protocol",
  "crates/nu-plugin-nuvim",
  "crates/nvim-nu",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/roshbhatia/nu_plugin_nvim"

[workspace.dependencies]
nu-plugin = "0.115.1"
nu-protocol = "0.115.1"
nvim-oxi = { version = "0.6.0", features = ["neovim-0-11"] }
rmpv = "1.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
