name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Match the tag to Cargo.toml
        run: |
          package_version=$(nix develop --command cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nu-plugin-nuvim") | .version')
          test "$GITHUB_REF_NAME" = "v$package_version"

  check:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    name: Check ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Create the source release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --latest --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
